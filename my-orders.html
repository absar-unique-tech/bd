<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders - ABSAR UNIQUE TECH</title>
<!-- Firebase Compat - TV Compatible -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--primary:#ff6b00;--dark:#1a1a1a;--gray:#f5f5f5}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--gray)}
.header{background:linear-gradient(135deg,var(--primary),#ff8533);color:#fff;padding:15px;text-align:center;font-size:18px;font-weight:700;position:sticky;top:0;z-index:100}
.container{padding:15px;padding-bottom:80px}
.order-card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;gap:12px}
.order-card img{width:70px;height:70px;object-fit:cover;border-radius:8px;background:#f5f5f5}
.order-info{flex:1}
.order-name{font-weight:600;font-size:15px;margin-bottom:4px;line-height:1.3}
.order-price{color:var(--primary);font-weight:800;font-size:16px}
.order-date{font-size:12px;color:#666;margin:4px 0}
.order-color{font-size:12px;color:#666}
.order-phone{font-size:12px;color:#666}
.status{background:#e8f5e9;color:#2e7d32;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;display:inline-block;margin-top:4px}
.status.pending{background:#fff3e0;color:#f57c00}
.status.shipped{background:#e3f2fd;color:#1976d2}
.status.delivered{background:#e8f5e9;color:#2e7d32}
.empty{text-align:center;padding:60px 20px;color:#666}
.back-btn{position:fixed;bottom:20px;left:15px;right:15px;background:var(--primary);color:#fff;padding:14px;border:none;border-radius:8px;font-weight:700;text-align:center;text-decoration:none}
.loading{text-align:center;padding:40px;color:#666}
</style>
</head>
<body>
<div class="header">📦 My Orders</div>
<div class="container" id="orderList">
<div class="loading">Loading orders...</div>
</div>
<a href="index.html" class="back-btn">← Back to Home</a>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyCI39dQTYcZ76ROxUY73jYB3OZPfjsyegI",
  authDomain: "absar-unique-tech.firebaseapp.com",
  databaseURL: "https://absar-unique-tech-default-rtdb.firebaseio.com",
  projectId: "absar-unique-tech",
  storageBucket: "absar-unique-tech.firebasestorage.app",
  messagingSenderId: "576285730220",
  appId: "1:576285730220:web:1d3cdf9cf3ddc4e00b4609"
};

firebase.initializeApp(firebaseConfig);
var database = firebase.database();

var orderList = document.getElementById('orderList');
var userPhone = localStorage.getItem('userPhone');
var localOrders = JSON.parse(localStorage.getItem('my_orders')) || [];

function renderOrders(orders) {
  if (!orders || orders.length === 0) {
    orderList.innerHTML = '<div class="empty">আপনি এখনো কোনো অর্ডার করেননি 🛒<br><br>প্রোডাক্ট কিনে এখানে দেখুন</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < orders.length; i++) {
    var order = orders[i];
    var status = order.orderStatus || order.status || 'Pending';
    var statusClass = status === 'New' || status === 'Pending' ? 'pending' :
                      status === 'Shipped' ? 'shipped' :
                      status === 'Delivered' ? 'delivered' : 'pending';

    // Handle single product vs multiple item structure
    var productName = order.productName || (order.items && order.items[0] ? order.items[0].name : 'Product');
    var productColor = order.productColor || (order.items && order.items[0] ? order.items[0].color : 'N/A');
    var productImage = order.productImage || (order.items && order.items[0] ? order.items[0].img : 'https://via.placeholder.com/70');
    var totalAmount = order.totalAmount || order.total || 0;
    var orderTime = order.orderTime || order.date || '';
    var phone = order.phone || 'N/A';

    html += '<div class="order-card">' +
              '<img src="' + productImage + '" alt="' + productName + '" onerror="this.src=\'https://via.placeholder.com/70\'">' +
              '<div class="order-info">' +
                '<div class="order-name">' + productName + '</div>' +
                '<div class="order-color">Color: ' + productColor + '</div>' +
                '<div class="order-phone">Phone: ' + phone + '</div>' +
                '<div class="order-price">৳' + totalAmount + '</div>' +
                '<div class="order-date">📅 ' + orderTime + '</div>' +
                '<span class="status ' + statusClass + '">' + status + '</span>' +
              '</div>' +
            '</div>';
  }
  orderList.innerHTML = html;
}

// 1. Initial Load from LocalStorage (Instant render)
if (localOrders.length > 0) {
  renderOrders(localOrders);
}

// 2. Fetch/Sync Realtime Orders from Firebase
database.ref('orders').on('value', function(snapshot) {
  var firebaseOrders = [];

  snapshot.forEach(function(child) {
    var order = child.val();
    order.id = child.key;

    // Filter by logged-in phone OR match with stored local order IDs
    var matchPhone = userPhone && order.phone === userPhone;
    var matchLocalId = localOrders.some(function(lo) { return lo.orderId === order.orderId; });

    if (matchPhone || matchLocalId) {
      firebaseOrders.push(order);
    }
  });

  if (firebaseOrders.length > 0) {
    firebaseOrders.reverse();
    renderOrders(firebaseOrders);
  } else if (localOrders.length === 0) {
    renderOrders([]);
  }
}, function(error) {
  if (localOrders.length === 0) {
    orderList.innerHTML = '<div class="empty">Error loading orders<br>' + error.message + '</div>';
  }
});
</script>
</body>
</html>
